# 中国独立游戏社团地图（全国版）：纯静态站，http://118.89.150.249:8090/
# 文件在 /www/wwwroot/igcm，由本地 v2-civ/deploy/update.sh 更新。和光的 80、8080 站点互不影响。
server {
    listen 8090;
    listen [::]:8090;
    server_name _;
    root /www/wwwroot/igcm;
    index index.html;

    access_log /www/wwwlogs/igcm.access.log;
    error_log  /www/wwwlogs/igcm.error.log;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm text/plain;

    # 不在 server 里写 types {}：那会整块替换默认 MIME 表，js、css 就成了 octet-stream，浏览器拒绝执行。
    # .glb 不在默认表里，下面单独给它类型。

    # 带哈希的构建产物：一年缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # 数据、模型、贴图、字体、头像：没带哈希，缓存 1 小时（更新后最多 1 小时生效）
    location ~ .glb$ { default_type model/gltf-binary; expires 1h; try_files $uri =404; }
    location ~ ^/(data|models|tex|fonts|logos)/ {
        expires 1h;
        try_files $uri =404;
    }
    # 首页不缓存，更新后立刻拿到新的 assets 文件名
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
