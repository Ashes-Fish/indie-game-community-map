  const em = s.logo ? `<img src="../site/${s.logo}" alt="">` : [...s.name.replace(/[（(].*$/, '')][0];
  el.innerHTML = `<span class="em">${em}</span><span class="nm">${s.name.replace(/[（(].*$/, '')}</span>`;
  el.title = `${s.name} · ${s.city}`;
  labelsEl.appendChild(el);
  labels.push({ el, pos: new THREE.Vector3(tx[s.tile], top(s.tile) + .72, tz[s.tile]) });
}
const cities = new Set(T.sites.map(s => s.city));
document.getElementById('sCount').textContent = document.getElementById('sCount2').textContent = T.sites.length;
document.getElementById('sCity').textContent = cities.size;
const _v = new THREE.Vector3();
function updateLabels() {
  const w = innerWidth, h = innerHeight, compact = camera.position.distanceTo(controls.target) > 120;
  const shown = [];
  const items = labels.map(l => { _v.copy(l.pos).project(camera); return { l, x: (_v.x + 1) / 2 * w, y: (1 - _v.y) / 2 * h, z: _v.z }; }).sort((a, b) => b.y - a.y);
  for (const it of items) {
    const { el } = it.l, vis = it.z < 1 && it.x > -50 && it.x < w + 50 && it.y > 0 && it.y < h + 40;
    el.style.display = vis ? '' : 'none'; if (!vis) continue;
    el.classList.toggle('compact', compact);
    el.style.left = it.x.toFixed(1) + 'px'; el.style.top = it.y.toFixed(1) + 'px';
    const wd = compact ? 22 : (it.l.w ||= el.offsetWidth || 120);
    const hit = shown.some(o => Math.abs(o.x - it.x) < (wd + o.w) / 2 + 4 && Math.abs(o.y - it.y) < (compact ? 18 : 30));
    el.classList.toggle('hide', hit && !compact);
    if (!hit) shown.push({ x: it.x, y: it.y, w: wd });
  }
}

/* ============ 悬停信息 ============ */
const BN = ['深海', '近海', '湖泊', '平原', '旱作农田', '水田', '草原', '高寒草甸', '沙漠', '戈壁', '黄土高原', '高寒荒原', '冰川雪原', '喀斯特峰林', '林地', '热带雨林'];
const FN = ['', '针叶林', '阔叶林', '针阔混交林', '竹林', '雨林', '椰林', '梯田', '绿洲', '茶园'];
const EL = ['', '0–100 m', '100–300 m', '300–700 m', '700–1200 m', '1.2–2 km', '2–3 km', '3–4.2 km', '4.2–5.2 km', '> 5.2 km'];
const hoverMesh = (() => {
  const g = new THREE.RingGeometry(.86, 1, 6, 1, Math.PI / 6).rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .9, depthTest: false }));
  m.visible = false; m.renderOrder = 5; scene.add(m); return m;
})();
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let hovered = -1;
const tName = document.getElementById('tName'), tSub = document.getElementById('tSub'), tMeta = document.getElementById('tMeta');
canvas.addEventListener('pointermove', e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(capMesh, false)[0];
  const i = hit ? capTiles[hit.instanceId] : -1;
  if (i === hovered) return; hovered = i;
  if (i < 0) { hoverMesh.visible = false; return; }
  hoverMesh.visible = true; hoverMesh.position.set(tx[i], top(i) + .03, tz[i]);
  const s = siteTiles.get(i);
  tName.textContent = s ? s.name : relief[i] === 2 ? '山脉' : BN[biome[i]] + (relief[i] === 1 ? '丘陵' : '');
  tSub.textContent = s ? `${s.city}${s.founded ? ' · ' + s.founded + ' 年成立' : ''}` : [relief[i] === 2 ? BN[biome[i]] : '', FN[feat[i]]].filter(Boolean).join(' · ') || '\u00a0';
  tMeta.textContent = `${T.lon[i].toFixed(1)}°E  ${T.lat[i].toFixed(1)}°N` + (isSea(i) ? '' : `  ·  海拔 ${EL[level[i]] || '—'}`);
});

/* ============ 小地图 ============ */
const mm = document.getElementById('minimap'), mg = mm.getContext('2d');
const MS = Math.min(mm.width / (C * SQ3 + 1), mm.height / (R * 1.5 + 1));
const MX = (mm.width - C * SQ3 * MS) / 2, MZ = (mm.height - R * 1.5 * MS) / 2;
const w2m = (x, z) => [MX + (x + X0) * MS, MZ + (z + Z0) * MS];
const miniBase = document.createElement('canvas'); miniBase.width = mm.width; miniBase.height = mm.height;
{
  const g = miniBase.getContext('2d'); g.fillStyle = '#cdb88e'; g.fillRect(0, 0, mm.width, mm.height);
  for (let i = 0; i < N; i++) {
    if (!drawn[i]) continue;
    let c = relief[i] === 2 ? (snowy(i) ? new THREE.Color(0xdfe3e2) : new THREE.Color(0x7d705e)) : new THREE.Color(isWet(i) ? WATER[biome[i]] : GROUND[biome[i]]);
    c = tint(c.getHex(), fog[i]);
    g.fillStyle = '#' + c.getHexString(); const [u, v] = w2m(tx[i], tz[i]);
    g.fillRect(u - MS * .9, v - MS * .8, MS * 1.8, MS * 1.6);
  }
  g.fillStyle = '#c22f25';
  for (const s of T.sites) { const [u, v] = w2m(tx[s.tile], tz[s.tile]); g.beginPath(); g.arc(u, v, 2.4, 0, 7); g.fill(); }
}
function drawMini() {
  mg.drawImage(miniBase, 0, 0);
  const [u, v] = w2m(controls.target.x, controls.target.z), d = camera.position.distanceTo(controls.target);
  mg.strokeStyle = '#fff'; mg.lineWidth = 1.5; mg.strokeRect(u - d * .55 * MS, v - d * .32 * MS, d * 1.1 * MS, d * .64 * MS);
}
mm.addEventListener('click', e => {
  const b = mm.getBoundingClientRect(), u = (e.clientX - b.left) * mm.width / b.width, v = (e.clientY - b.top) * mm.height / b.height;
  const x = (u - MX) / MS - X0, z = (v - MZ) / MS - Z0, off = camera.position.clone().sub(controls.target);
  controls.target.set(x, 1, z); camera.position.copy(controls.target).add(off);
});

/* ============ 循环 ============ */
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
let frame = 0;
function loop() {
  controls.update();
  const d = camera.position.distanceTo(controls.target), half = THREE.MathUtils.clamp(d * .85, 18, 190);
  const t = controls.target;
  sun.position.set(t.x - 60, 110, t.z + 45); sun.target.position.copy(t); sun.target.updateMatrixWorld();
  Object.assign(sun.shadow.camera, { left: -half, right: half, top: half, bottom: -half, near: 1, far: 400 }); sun.shadow.camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  updateLabels();
  if (frame++ % 10 === 0) drawMini();
  requestAnimationFrame(loop);
}
loop();
window.__stats = { tiles: capTiles.length, instances: instanceTotal, rivers: T.rivers.length, sites: T.sites.length };
window.__ready = true;
</script>
