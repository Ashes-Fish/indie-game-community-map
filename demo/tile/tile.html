/* ============ 实例化小物件（白色顶点色，靠实例颜色着色） ============ */
function white(g) { g = g.index ? g.toNonIndexed() : g; g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 3).fill(1), 3)); return g; }

  const g = new THREE.BufferGeometry();

             -.5,0,.5, .5,1,0, .5,0,.5,  -.5,0,.5, -.5,1,0, .5,1,0,     // 前坡
             -.5,0,-.5, -.5,1,0, -.5,0,.5,  .5,0,-.5, .5,0,.5, .5,1,0,  // 山墙

  ball: white(new THREE.IcosahedronGeometry(.5, 1).translate(0, .5, 0)),
  ball0: white(new THREE.IcosahedronGeometry(.5, 0).translate(0, .5, 0)),
  cone6: white(new THREE.ConeGeometry(.5, 1, 6).translate(0, .5, 0)),
  cone4: white(new THREE.ConeGeometry(.5, 1, 4).translate(0, .5, 0)),
  cyl: white(new THREE.CylinderGeometry(.5, .5, 1, 8).translate(0, .5, 0)),
  hexd: white(new THREE.CylinderGeometry(.5, .5, 1, 6).translate(0, .5, 0)),
  dome: white(new THREE.SphereGeometry(.5, 10, 5, 0, Math.PI * 2, 0, Math.PI / 2)),

/* ============ 地块本体：分层岩壁 + 高精度顶面 ============ */

  // 开口柱体：不带顶盖，否则会盖住比地表低的水面

function strata(lip, earth = 0x7a5a3c) {

  core.castShadow = true; tile.add(core);

    const e = Math.floor(rand() * 6), t = rr(.15, .85), a1 = e * Math.PI / 3, a2 = (e + 1) * Math.PI / 3;
    const x = (Math.sin(a1) * (1 - t) + Math.sin(a2) * t) * .955, z = (Math.cos(a1) * (1 - t) + Math.cos(a2) * t) * .955;

let HF = () => 0;

function topSurface(n, hf, cf) {

  put('gable', 0, Y + .17, -.18, .4, .11, .26, 0, TILE);
  put('box', 0, Y + .276, -.18, .42, .014, .016, 0, GOLD);
  for (const sx of [-.21, .21]) put('cone4', sx, Y + .274, -.18, .022, .035, .022, 0, GOLD);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) put('box', sx * .215, Y + .17, -.18 + sz * .12, .06, .012, .02, sx * sz * .8, TILE, 0, sx * .45);
  for (let k = 0; k < 3; k++) put('box', 0, Y + .03 - k * .012, -.055 + k * .02, .14, .015, .02, 0, 0xb5ae9d);
  // 配殿：东西厢房，面朝院内
  for (const sx of [-.3, .3]) {
    put('box', sx, Y, .06, .11, .075, .2, 0, RED);
    put('box', sx - Math.sign(sx) * .056, Y, .06, .004, .045, .05, 0, 0x3b2a1e);
    put('box', sx, Y + .075, .06, .15, .012, .24, 0, TILE);
    put('gable', sx, Y + .087, .06, .22, .06, .14, Math.PI / 2, TILE);
    put('box', sx, Y + .147, .06, .012, .01, .22, 0, GOLD);
  }
  // 院内：石灯
  for (const sx of [-.1, .1]) { put('box', sx, Y, .16, .03, .05, .03, 0, 0x8a8577); put('cone4', sx, Y + .05, .16, .05, .025, .05, Math.PI / 4, 0x6e6a5f); }
  // 社团大旗：立在门外，带石座
  { const fx = .56, fz = .42, fy = gy(fx, fz);
    put('box', fx, fy, fz, .07, .03, .07, 0, 0xa9a394); put('box', fx, fy + .03, fz, .05, .02, .05, 0, 0xb8b2a2);
    put('cyl', fx, fy + .05, fz, .011, .44, .011, 0, 0x4a3524);
    put('ball0', fx, fy + .48, fz, .024, .024, .024, 0, GOLD);
    for (let k = 0; k < 6; k++) {   // 旗面分段，做出飘动的弧度
      const w = .03, px = fx + .015 + w * (k + .5), pz = fz + Math.sin(k * .9) * .012, ry = -Math.cos(k * .9) * .35;
      put('box', px, fy + .34, pz, w + .002, .12, .008, ry, 0xb3302a);
      put('box', px, fy + .34, pz, w + .002, .01, .011, ry, GOLD);
      put('box', px, fy + .45, pz, w + .002, .01, .011, ry, GOLD);
    }
    put('hexd', fx + .09, fy + .4, fz + Math.sin(2.2) * .012 + .006, .05, .005, .05, -Math.cos(2.2) * .35, GOLD, Math.PI / 2); }
  // 院外：树木与民居（白墙黛瓦，和院子保持距离）
  for (const [x, z, s] of [[-.64, .3, 1.1], [.7, .08, 1], [-.55, -.62, 1], [.55, -.64, .9], [-.74, -.2, .9], [-.3, .76, .85]]) roundTree(x, z, s);
  for (const [x, z] of [[.72, -.22], [-.7, .04], [.3, .7]]) fir(x, z, 1);
  for (const [x, z, ry] of [[-.3, .56, .1], [-.52, .52, .3], [.46, .74, -.2]]) { const y = gy(x, z);
    put('box', x, y, z, .12, .06, .09, ry, 0xece6d8); put('gable', x, y + .06, z, .14, .045, .11, ry, 0x3e4349); }
  for (let t = 0; t < 1; t += .09) put('box', 0, gy(0, .37 + t * .6) - .002, .37 + t * .6, .09, .006, .05, 0, pick([0xb8b2a2, 0xa8a293]));
  grassTufts(50, .95, 0x5e8f38, (x, z) => !inYard(x, z) && !road(x, z) && hexS(x, z) > .1);
  flush();
  return { title: '社团据点', cam: [1.95, 2.25, 2.85], target: [0, .45, 0],
    desc: ['每个社团在地图上都是这样一座据点，大小一致，不体现规模', '红墙黛瓦：院墙、门楼、正殿、东西配殿，正殿有金色屋脊，檐角起翘', '门外立着社团大旗，地图上旗帜位置会显示社团名和 Logo', '门前挂红灯笼，院外有民居和树木'] };
}

/* ============ 组装 ============ */
const BUILD = { paddy, mountain, desert, site };
const info = (BUILD[VARIANT] || paddy)();
document.getElementById('title').textContent = info.title;
document.getElementById('desc').innerHTML = info.desc.map(d => `<li>${d}</li>`).join('');
document.querySelectorAll('.tabs button').forEach(b => {
  b.setAttribute('aria-pressed', String(b.dataset.t === VARIANT));
  b.onclick = () => { params.set('t', b.dataset.t); params.delete('shot'); location.search = params.toString(); };
});
camera.position.set(...info.cam);
const controls = new OrbitControls(camera, canvas);
controls.target.set(...info.target); controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 1.6; controls.maxDistance = 7; controls.maxPolarAngle = 1.35;
controls.autoRotate = !SHOT && !matchMedia('(prefers-reduced-motion: reduce)').matches; controls.autoRotateSpeed = .6;
controls.update();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
(function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
window.__ready = true;
</script>
